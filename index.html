<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucky - App Jugadores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #a855f7;
            --accent: #c026d3;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.85);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1133);
            color: #e0e7ff;
            min-height: 100vh;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .casino-name {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--glass);
            border-radius: 24px;
            padding: 28px;
            margin: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }
        input, button {
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
        }
        input {
            background: #1e2937;
            border: 1px solid #64748b;
            color: white;
        }
        button {
            background: linear-gradient(90deg, #a855f7, #c026d3);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items:center; justify-content:center; z-index: 1000; }
  .sala-btn {
    width: 100% !important;
    min-width: 100% !important;
    height: 96px;
    padding: 12px 14px;
    font-size: 1.05rem;
    font-weight: 700;
    background: linear-gradient(90deg, #a855f7, #c026d3);
    color: white;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.25;
    box-sizing: border-box;
    margin: 0;
}

.sala-btn:active {
    transform: scale(0.94);
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.6);
}
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1 id="casino-name" class="casino-name">Nucky</h1>
    </div>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="card" style="margin-top:80px; max-width:420px; margin-left:auto; margin-right:auto;">
            <h2 style="text-align:center; margin-bottom:24px;">Iniciar Sesión</h2>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="loginJugador()">Ingresar</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="card">
            <h2 id="bienvenida" style="text-align:center; margin-bottom:8px;"></h2>
            <p id="casino-subtitle" style="text-align:center; color:#c4b5fd; margin-bottom:20px;"></p>
        </div>

<!-- SALAS DE JUEGO - VERSIÓN FINAL SIN ESPACIO DERECHO -->
<div style="margin-top: 20px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
        <i class="fas fa-gamepad" style="color: #c026d3; font-size: 1.3rem;"></i>
        <h3 style="margin: 0; color: #e0e7ff; font-size: 1.25rem;">Salas de Juego</h3>
    </div>
    
    <div id="salas-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; padding: 0; margin: 0; box-sizing: border-box;">
        <!-- Los botones se generan por JavaScript -->
    </div>
</div>

        <!-- Modal Sala No Disponible -->
        <div id="modal-sala-no-disponible" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99999; align-items:center; justify-content:center;">
            <div style="background:#1e2937; max-width:380px; width:90%; border-radius:24px; padding:40px 30px; color:white; text-align:center;">
                <h2 style="margin-bottom:16px;">⚠️ Sala no disponible</h2>
                <p style="font-size:1.1rem; color:#c4b5fd;">Esta sala no está disponible en este momento.</p>
         <button onclick="hideSalaNoDisponibleModal()" style="margin-top:30px; width:100%; padding:16px; background:#a855f7; color:white; border:none; border-radius:16px; font-weight:700;">Entendido</button>
    </div>
</div>

        <!-- Ruleta -->
        <div class="card">
            <h3 style="margin-bottom:16px; color:#c4b5fd;">🎡 Ruleta</h3>
            <div id="ruleta-info"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSubscriberId = null;
    let currentUsuario = null;

    async function loginJugador() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        if (!username || !password) return alert("Usuario y contraseña son obligatorios");

        const { data, error } = await _supabase
            .from('usuarios')
            .select('*, suscriptores(id, nombre_casino, sala1_link, sala2_link, sala3_link, sala4_link, whatsapp, instagram, telegram, premios_normal, premios_dorada, dias_dorada)')
            .eq('username', username)
            .eq('password', password)
            .single();

        if (error || !data) return alert("Credenciales incorrectas");

        currentSubscriberId = data.subscriber_id;
        currentUsuario = username;

        // Mostrar dashboard
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        // Cargar datos del suscriptor
        await cargarDatosSuscriptor(data.suscriptores);
    }

    async function cargarDatosSuscriptor(sub) {
    // Nombre del casino
    document.getElementById('casino-name').textContent = sub.nombre_casino || "Nucky";
    document.getElementById('bienvenida').innerHTML = `¡Hola <strong>${currentUsuario}</strong>!`;
    document.getElementById('casino-subtitle').textContent = sub.nombre_casino || "";

    // Salas de Juego - Siempre 4 botones fijos
    const salasHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <button onclick="${sub.sala1_link ? `window.open('${sub.sala1_link}', '_blank')` : `showSalaNoDisponibleModal()`}" 
                    class="sala-btn">Celuapuestas</button>
            <button onclick="${sub.sala2_link ? `window.open('${sub.sala2_link}', '_blank')` : `showSalaNoDisponibleModal()`}" 
                    class="sala-btn">Zeus</button>
            <button onclick="${sub.sala3_link ? `window.open('${sub.sala3_link}', '_blank')` : `showSalaNoDisponibleModal()`}" 
                    class="sala-btn">Bet30</button>
            <button onclick="${sub.sala4_link ? `window.open('${sub.sala4_link}', '_blank')` : `showSalaNoDisponibleModal()`}" 
                    class="sala-btn">Konabet</button>
        </div>
    `;
    document.getElementById('salas-container').innerHTML = salasHTML;

    // Ruleta
    const ruletaHTML = `
        <p><strong>Premios Normal:</strong> ${sub.premios_normal || '—'}</p>
        <p><strong>Premios Dorada:</strong> ${sub.premios_dorada || '—'}</p>
        <p><strong>Días para Dorada:</strong> ${sub.dias_dorada || '7'} días</p>
    `;
    document.getElementById('ruleta-info').innerHTML = ruletaHTML;
}
</script>
</body>
</html>
