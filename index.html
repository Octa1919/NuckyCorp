<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucky - App Jugadores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #a855f7;
            --accent: #c026d3;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.92);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1133);
            color: #e0e7ff;
            min-height: 100vh;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .casino-name {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--glass);
            border-radius: 24px;
            padding: 42px 32px;
            margin: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(168, 85, 247, 0.3);
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        /* LOGIN MEJORADO */
        #login-screen .card h2 {
            text-align: center;
            margin-bottom: 32px;
            font-size: 1.75rem;
        }
        #login-screen input {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #64748b;
            color: white;
            padding: 18px 20px;
            border-radius: 16px;
            margin-bottom: 18px;
            width: 100%;
            font-size: 1.1rem;
        }
        #login-screen input:focus {
            border-color: #c026d3;
            box-shadow: 0 0 0 4px rgba(192, 38, 211, 0.3);
        }
        #login-screen button {
            background: linear-gradient(90deg, #a855f7, #c026d3);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 18px;
            width: 100%;
            cursor: pointer;
        }
        .login-link {
            display: block;
            text-align: center;
            color: #c4b5fd;
            margin-top: 12px;
            font-size: 1.05rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <h1 id="casino-name" class="casino-name">Nucky</h1>
        <button onclick="toggleHamburgerMenu()" style="background:none;border:none;font-size:1.8rem;color:#c026d3;">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="card" style="margin-top: 100px;">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="loginJugador()">Ingresar</button>
            
            <a onclick="crearCuenta()" class="login-link">Crear cuenta nueva</a>
            <a onclick="recuperarDatos()" class="login-link">Olvidé mis datos</a>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <!-- CARGAR + RETIRAR -->
        <div class="card" style="margin-top: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <button onclick="cargarSaldo()" class="btn-accion btn-cargar">
                    <i class="fas fa-wallet"></i>
                    Cargar Saldo
                </button>
                <button onclick="abrirChatwoot()" class="btn-accion btn-retirar">
                    <i class="fas fa-money-bill-wave"></i>
                    Retirar Fondos
                </button>
            </div>
        </div>

        <!-- SALUDO CON LÍNEAS -->
        <div class="greeting-separator">
            <h2 id="bienvenida" class="greeting-text"></h2>
        </div>

        <!-- ATENCIÓN PERSONALIZADA -->
        <div class="card" style="margin-top: 10px;">
            <button onclick="abrirChatwoot()" class="btn-atencion">
                <i class="fas fa-headset"></i>
                Atención Personalizada
            </button>
        </div>

        <!-- SALAS DE JUEGO -->
        <div class="card" style="margin-top: 24px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
                <i class="fas fa-gamepad" style="color: #c026d3; font-size: 1.35rem;"></i>
                <h3 style="margin: 0; color: #e0e7ff; font-size: 1.25rem;">Salas de Juego</h3>
            </div>
            <div id="salas-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; padding: 0 !important; margin: 0 !important; box-sizing: border-box;">
            </div>
        </div>

        <!-- RULETA VIP -->
        <div class="card" style="margin-top: 10px;">
            <button onclick="abrirRuleta()" class="btn-ruleta">
                <i class="fas fa-dice"></i>
                Ruleta VIP
            </button>
        </div>
    </div>

    <!-- MENÚ HAMBURGUESA LATERAL -->
    <div id="hamburger-menu">
        <div style="padding:0 20px;">
            <a onclick="toggleHamburgerMenu(); abrirPerfil()" class="menu-item"><i class="fas fa-user"></i> Perfil</a>
            <a onclick="toggleHamburgerMenu(); abrirCronograma()" class="menu-item"><i class="fas fa-calendar-alt"></i> Cronograma</a>
            <a onclick="toggleHamburgerMenu(); abrirReferir()" class="menu-item"><i class="fas fa-share"></i> Referir</a>
            <a onclick="toggleHamburgerMenu(); abrirChatwoot()" class="menu-item"><i class="fas fa-headset"></i> Contacto</a>
            <a onclick="toggleHamburgerMenu(); instalarApp()" class="menu-item"><i class="fas fa-download"></i> Instalar App</a>
            <a onclick="toggleHamburgerMenu(); cerrarSesion()" class="menu-item" style="color:#f43f5e;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
        </div>
    </div>

    <!-- Modales -->
    <div id="modal-sala-no-disponible" class="modal" style="display:none;">
        <div style="background:#1e2937; max-width:380px; width:90%; border-radius:24px; padding:40px 30px; color:white; text-align:center;">
            <h2 style="margin-bottom:16px;">⚠️ Sala no disponible</h2>
            <p style="font-size:1.1rem; color:#c4b5fd;">Esta sala no está disponible en este momento.</p>
            <button onclick="hideSalaNoDisponibleModal()" style="margin-top:30px; width:100%; padding:16px; background:#a855f7; color:white; border:none; border-radius:16px; font-weight:700;">Entendido</button>
        </div>
    </div>

    <div id="modal-cargar-saldo" class="modal" style="display:none;">
        <div style="background:#1e2937; max-width:420px; width:92%; border-radius:24px; padding:30px; color:white; text-align:center;">
            <h2 style="margin-bottom:20px;">💰 Cargar Saldo</h2>
            <div id="cbu-activo-info" style="background:#0f172a; padding:20px; border-radius:16px; margin:20px 0; text-align:left;"></div>
            <button onclick="hideCargarSaldoModal()" style="width:100%; padding:16px; background:#a855f7; color:white; border:none; border-radius:16px; font-weight:700;">Cerrar</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSubscriberId = null;
    let currentUsuario = null;

    // ==================== LEER SUSCRIPTOR DESDE LA URL ====================
    function getSubscriberFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('s') || params.get('subscriber') || params.get('subscriber_id');
    }

    async function loginJugador() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();
        if (!username || !password) return alert("Usuario y contraseña son obligatorios");

        const { data, error } = await _supabase
            .from('usuarios')
            .select('*, suscriptores(id, nombre_casino, sala1_link, sala2_link, sala3_link, sala4_link, premios_normal, premios_dorada, dias_dorada)')
            .eq('username', username)
            .eq('password', password)
            .single();

        if (error || !data) return alert("Credenciales incorrectas");

        currentSubscriberId = data.subscriber_id;
        currentUsuario = username;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        await cargarDatosSuscriptor(data.suscriptores);
    }

    async function cargarDatosSuscriptor(sub) {
        document.getElementById('casino-name').textContent = sub.nombre_casino || "Nucky";
        document.getElementById('bienvenida').innerHTML = `¡Hola <strong>${currentUsuario}</strong>!`;

        const salasHTML = `
            <button onclick="${sub.sala1_link ? `window.open('${sub.sala1_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Celuapuestas</button>
            <button onclick="${sub.sala2_link ? `window.open('${sub.sala2_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Zeus</button>
            <button onclick="${sub.sala3_link ? `window.open('${sub.sala3_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Bet30</button>
            <button onclick="${sub.sala4_link ? `window.open('${sub.sala4_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Konabet</button>
        `;
        document.getElementById('salas-container').innerHTML = salasHTML;
    }

    // ==================== RECUPERAR DATOS (AHORA CON WHATSAPP DEL SUSCRIPTOR) ====================
    async function recuperarDatos() {
        const subscriberParam = getSubscriberFromUrl();

        let whatsapp = "549XXXXXXXXXX"; // número de respaldo por si no encuentra

        if (subscriberParam) {
            const { data } = await _supabase
                .from('suscriptores')
                .select('whatsapp')
                .eq('id', subscriberParam)           // si usas ID numérico
                .or(`nombre_casino.eq.${subscriberParam},short_code.eq.${subscriberParam}`) // o por nombre
                .single();

            if (data && data.whatsapp) whatsapp = data.whatsapp;
        }

        const mensaje = encodeURIComponent("Hola, olvidé mis datos de acceso. Por favor ayúdame.");
        window.open(`https://wa.me/${whatsapp}?text=${mensaje}`, "_blank");
    }

    // ==================== Crear cuenta (placeholder) ====================
    function crearCuenta() {
        alert("📝 Crear cuenta nueva\n\nAquí se abrirá el formulario de registro.");
    }

    // ==================== MENÚ HAMBURGUESA ====================
    function toggleHamburgerMenu() {
        const menu = document.getElementById('hamburger-menu');
        menu.style.right = menu.style.right === '0px' ? '-100%' : '0px';
    }

    // Cerrar menú al tocar fuera
    document.addEventListener('click', function(e) {
        const menu = document.getElementById('hamburger-menu');
        const hamburgerBtn = document.querySelector('.hamburger');
        if (menu.style.right === '0px' && !menu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
            menu.style.right = '-100%';
        }
    });

    // Funciones del menú
    function abrirPerfil() { alert("👤 Perfil - Se desarrollará más adelante"); toggleHamburgerMenu(); }
    function abrirCronograma() { alert("📅 Cronograma - Se desarrollará más adelante"); toggleHamburgerMenu(); }
    function abrirReferir() { alert("🔗 Referir - Se desarrollará más adelante"); toggleHamburgerMenu(); }
    function abrirChatwoot() { alert("🟢 Chatwoot se abrirá aquí cuando lo configures completamente."); toggleHamburgerMenu(); }
    function instalarApp() { alert("📲 Instalar App - Se desarrollará más adelante"); toggleHamburgerMenu(); }
    function cerrarSesion() {
        if (confirm("¿Cerrar sesión?")) location.reload();
    }

    function abrirRuleta() {
        alert("🎡 Ruleta VIP\n\nAquí se abrirá la ruleta cuando la desarrollemos.");
    }

    async function cargarSaldo() {
        if (!currentSubscriberId) return alert("Error: No se detectó suscriptor");
        const modalContent = document.getElementById('cbu-activo-info');
        modalContent.innerHTML = `<p style="text-align:center; color:#67e8f9;">Aquí aparecerá tu CBU activo.</p>`;
        document.getElementById('modal-cargar-saldo').style.display = 'flex';
    }

    function hideCargarSaldoModal() {
        document.getElementById('modal-cargar-saldo').style.display = 'none';
    }

    function showSalaNoDisponibleModal() {
        document.getElementById('modal-sala-no-disponible').style.display = 'flex';
    }

    function hideSalaNoDisponibleModal() {
        document.getElementById('modal-sala-no-disponible').style.display = 'none';
    }

    window.onload = () => {};
</script>
</body>
</html>
