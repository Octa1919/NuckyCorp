<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucky - App Jugadores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #a855f7;
            --accent: #c026d3;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.92);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1133);
            color: #e0e7ff;
            min-height: 100vh;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .casino-name {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #c026d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--glass);
            border-radius: 24px;
            padding: 28px;
            margin: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        /* Botones de acción */
        .btn-accion {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-cargar {
            background: linear-gradient(90deg, #0ea5e9, #22d3ee);
            color: #0f172a;
        }
        .btn-retirar {
            background: linear-gradient(90deg, #c026d3, #db2777);
            color: white;
        }

        /* Atención Personalizada */
        .btn-atencion {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #22d3ee, #67e8f9);
            color: #0f172a;
            border: none;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(34, 211, 238, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-atencion:active { transform: scale(0.95); }
        .btn-atencion::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -75%;
            width: 50%;
            height: 300%;
            background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 70%);
            transform: skewX(-25deg);
            animation: shine 3.5s linear infinite;
        }
        @keyframes shine { 100% { left: 125%; } }

        /* Botón Ruleta VIP - Plateado Diamante */
        .btn-ruleta {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
            color: #0f172a;
            border: 2px solid #94a3b8;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(148, 163, 184, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-ruleta:active { transform: scale(0.95); }
        .btn-ruleta::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -75%;
            width: 50%;
            height: 300%;
            background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 70%);
            transform: skewX(-25deg);
            animation: shine 3.8s linear infinite;
        }
        @keyframes shine { 100% { left: 125%; } }

        /* Saludo con líneas separadoras */
        .greeting-separator {
            display: flex;
            align-items: center;
            margin: 18px 20px;
            color: #64748b;
        }
        .greeting-separator::before,
        .greeting-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #64748b, transparent);
        }
        .greeting-text {
            font-size: 1.4rem;
            font-weight: 600;
            padding: 0 20px;
            white-space: nowrap;
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            align-items:center; 
            justify-content:center; 
            z-index: 1000; 
        }

        .sala-btn {
            width: 100% !important;
            height: 96px;
            padding: 14px 12px;
            font-size: 1.05rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #c026d3);
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
            box-sizing: border-box;
            margin: 0 !important;
        }
        .sala-btn:active {
            transform: scale(0.93);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.6);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <h1 id="casino-name" class="casino-name">Nucky</h1>
    </div>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="card" style="margin-top:90px; max-width:420px; margin-left:auto; margin-right:auto; padding:42px 32px;">
            <h2 style="text-align:center; margin-bottom:32px;">Iniciar Sesión</h2>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="loginJugador()">Ingresar</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <!-- CARGAR + RETIRAR -->
        <div class="card" style="margin-top: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <button onclick="cargarSaldo()" class="btn-accion btn-cargar">
                    <i class="fas fa-wallet"></i>
                    Cargar Saldo
                </button>
                <button onclick="abrirChatwoot()" class="btn-accion btn-retirar">
                    <i class="fas fa-money-bill-wave"></i>
                    Retirar Fondos
                </button>
            </div>
        </div>

        <!-- SALUDO CON LÍNEAS -->
        <div class="greeting-separator">
            <h2 id="bienvenida" class="greeting-text"></h2>
        </div>

        <!-- ATENCIÓN PERSONALIZADA -->
        <div class="card" style="margin-top: 10px;">
            <button onclick="abrirChatwoot()" class="btn-atencion">
                <i class="fas fa-headset"></i>
                Atención Personalizada
            </button>
        </div>

        <!-- SALAS DE JUEGO -->
        <div class="card" style="margin-top: 24px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
                <i class="fas fa-gamepad" style="color: #c026d3; font-size: 1.35rem;"></i>
                <h3 style="margin: 0; color: #e0e7ff; font-size: 1.25rem;">Salas de Juego</h3>
            </div>
            <div id="salas-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; padding: 0 !important; margin: 0 !important; box-sizing: border-box;">
            </div>
        </div>

        <!-- BOTÓN RULETA VIP -->
        <div class="card" style="margin-top: 10px;">
            <button onclick="abrirRuleta()" class="btn-ruleta">
                <i class="fas fa-dice"></i>
                Ruleta VIP
            </button>
        </div>

        <!-- Modales -->
        <div id="modal-sala-no-disponible" class="modal" style="display:none;">
            <div style="background:#1e2937; max-width:380px; width:90%; border-radius:24px; padding:40px 30px; color:white; text-align:center;">
                <h2 style="margin-bottom:16px;">⚠️ Sala no disponible</h2>
                <p style="font-size:1.1rem; color:#c4b5fd;">Esta sala no está disponible en este momento.</p>
                <button onclick="hideSalaNoDisponibleModal()" style="margin-top:30px; width:100%; padding:16px; background:#a855f7; color:white; border:none; border-radius:16px; font-weight:700;">Entendido</button>
            </div>
        </div>

        <div id="modal-cargar-saldo" class="modal" style="display:none;">
            <div style="background:#1e2937; max-width:420px; width:92%; border-radius:24px; padding:30px; color:white; text-align:center;">
                <h2 style="margin-bottom:20px;">💰 Cargar Saldo</h2>
                <div id="cbu-activo-info" style="background:#0f172a; padding:20px; border-radius:16px; margin:20px 0; text-align:left;"></div>
                <button onclick="hideCargarSaldoModal()" style="width:100%; padding:16px; background:#a855f7; color:white; border:none; border-radius:16px; font-weight:700;">Cerrar</button>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://vevptiayzleigkjtmyhc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VBu6hcwr-NKDyxcOc60wDQ_RFDkKQjd";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSubscriberId = null;
    let currentUsuario = null;

    async function loginJugador() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();
        if (!username || !password) return alert("Usuario y contraseña son obligatorios");

        const { data, error } = await _supabase
            .from('usuarios')
            .select('*, suscriptores(id, nombre_casino, sala1_link, sala2_link, sala3_link, sala4_link, premios_normal, premios_dorada, dias_dorada)')
            .eq('username', username)
            .eq('password', password)
            .single();

        if (error || !data) return alert("Credenciales incorrectas");

        currentSubscriberId = data.subscriber_id;
        currentUsuario = username;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        await cargarDatosSuscriptor(data.suscriptores);
    }

    async function cargarDatosSuscriptor(sub) {
        document.getElementById('casino-name').textContent = sub.nombre_casino || "Nucky";
        document.getElementById('bienvenida').innerHTML = `¡Hola <strong>${currentUsuario}</strong>!`;

        const salasHTML = `
            <button onclick="${sub.sala1_link ? `window.open('${sub.sala1_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Celuapuestas</button>
            <button onclick="${sub.sala2_link ? `window.open('${sub.sala2_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Zeus</button>
            <button onclick="${sub.sala3_link ? `window.open('${sub.sala3_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Bet30</button>
            <button onclick="${sub.sala4_link ? `window.open('${sub.sala4_link}', '_blank')` : `showSalaNoDisponibleModal()`}" class="sala-btn">Konabet</button>
        `;
        document.getElementById('salas-container').innerHTML = salasHTML;
    }

    function abrirRuleta() {
        alert("🎡 Ruleta VIP\n\nAquí se abrirá la ruleta cuando la desarrollemos.");
    }

    async function cargarSaldo() {
        if (!currentSubscriberId) return alert("Error: No se detectó suscriptor");
        const modalContent = document.getElementById('cbu-activo-info');
        modalContent.innerHTML = `<p style="text-align:center; color:#67e8f9;">Aquí aparecerá tu CBU activo.</p>`;
        document.getElementById('modal-cargar-saldo').style.display = 'flex';
    }

    function hideCargarSaldoModal() {
        document.getElementById('modal-cargar-saldo').style.display = 'none';
    }

    function abrirChatwoot() {
        alert("🟢 Chatwoot se abrirá aquí cuando lo configures completamente.");
    }

    function showSalaNoDisponibleModal() {
        document.getElementById('modal-sala-no-disponible').style.display = 'flex';
    }

    function hideSalaNoDisponibleModal() {
        document.getElementById('modal-sala-no-disponible').style.display = 'none';
    }

    window.onload = () => {};
</script>
</body>
</html>
