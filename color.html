    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const urlId = params.get('s') || params.get('subscriber') || params.get('subscriber_id');
    
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                         window.navigator.standalone === true;

        const yaVinculado = localStorage.getItem('subscriber_id_instalacion');

        if (urlId) {
            if (isStandalone) {
                if (!yaVinculado) {
                    localStorage.setItem('subscriber_id_instalacion', urlId);
                    window.__subscriberIdInstalacion = urlId;
                } else {
                    window.__subscriberIdInstalacion = yaVinculado;
                }
            } else {
                localStorage.setItem('subscriber_id_instalacion', urlId);
                window.__subscriberIdInstalacion = urlId;
            }
        } else if (yaVinculado) {
            window.__subscriberIdInstalacion = yaVinculado;
        } else {
            window.__subscriberIdInstalacion = null;
        }
    })();
    </script>
